[package]
name = "hayai"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
# Only the buffer/frame types are used (to feed BGRA icon pixels into GPUI's
# RenderImage); no decoders needed, so keep default features off to stay lean.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
