name: Feature request
description: Propose a focused Hayai capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What launcher workflow should Hayai make faster or simpler?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: budget
    attributes:
      label: Resource and compatibility impact
      description: Address idle memory/CPU, startup or search latency, dependencies, background work, and Windows support.
    validations:
      required: true
